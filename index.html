<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Réflexe 60 — v1.0</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#10131a,#1d2230);color:#fff;min-height:100vh}
.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#171b25;border:1px solid #303747;border-radius:22px;padding:18px;box-shadow:0 14px 35px #0005}
h1{margin:0 0 4px;font-size:34px}.sub{color:#aeb7c9;margin-bottom:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#222838;border-radius:14px;padding:9px;text-align:center}.stat b{display:block;font-size:20px}.stat small{color:#aeb7c9}
button{border:0;border-radius:13px;padding:12px 14px;font-weight:800;font-size:15px;background:#fff;color:#111;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.primary{background:#ffd83d}.secondary{background:#2a3142;color:#fff}.danger{background:#ff5a65;color:#fff}
.arena{position:relative;height:390px;background:radial-gradient(circle at 50% 40%,#293149,#10131a 72%);border-radius:20px;overflow:hidden;border:1px solid #394157;margin:12px 0}
.target{position:absolute;border-radius:50%;box-shadow:0 0 0 4px #fff2,0 0 28px currentColor;touch-action:manipulation;animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}.hit{animation:hit .18s forwards}@keyframes hit{to{transform:scale(1.7);opacity:0}}
.msg{text-align:center;color:#cbd3e2;min-height:26px}.shop{margin-top:14px}.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{background:#222838;border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px}.ball{width:30px;height:30px;border-radius:50%;box-shadow:0 0 15px currentColor;flex:none}.item button{margin-left:auto;padding:8px 9px;font-size:12px}.owned{color:#8fffa3;font-size:12px}.footer{text-align:center;color:#7f899d;font-size:12px;margin-top:12px}
@media(max-width:430px){.stats{grid-template-columns:repeat(2,1fr)}.arena{height:360px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>⚡ Réflexe 60</h1><div class="sub">Touchez les boules le plus vite possible.</div>
<div class="stats">
<div class="stat"><b id="score">0</b><small>Score</small></div>
<div class="stat"><b id="time">60</b><small>Temps</small></div>
<div class="stat"><b id="level">1</b><small>Niveau</small></div>
<div class="stat"><b id="coins">0</b><small>🪙 Pièces</small></div>
</div>
<div class="row">
<button id="start" class="primary">Commencer</button>
<button id="sound" class="secondary">🔊 Son ON</button>
<button id="reset" class="danger">Réinitialiser</button>
</div>
<div class="msg" id="msg">Chaque tranche de 10 touches augmente la difficulté.</div>
<div class="arena" id="arena"></div>
<div class="shop"><h2>🛍️ Boutique</h2><div class="shopgrid" id="shop"></div></div>
<div class="footer">Réflexe 60 v1.0 — progression sauvegardée sur cet appareil.</div>
</div></div>
<script>
const balls=[
 {id:'red',name:'Rouge',rarity:'Classique',price:0,color:'#ff3b4f'},
 {id:'blue',name:'Bleu',rarity:'Rapide',price:50,color:'#3195ff'},
 {id:'black',name:'Noir',rarity:'Solide',price:100,color:'#111'},
 {id:'green',name:'Vert',rarity:'Rare',price:180,color:'#31e875'},
 {id:'purple',name:'Violet',rarity:'Élite',price:300,color:'#b25cff'},
 {id:'gold',name:'Or',rarity:'Légendaire',price:500,color:'#ffd43b'}
];
let save=JSON.parse(localStorage.getItem('reflexe60')||'null')||{coins:0,owned:['red'],selected:'red',best:0};
let running=false,score=0,time=60,level=1,streak=0,combo=0,timer=null,target=null,soundOn=true,audio=null,musicTimer=null;
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem('reflexe60',JSON.stringify(save))}
function render(){ $('coins').textContent=save.coins; $('shop').innerHTML=balls.map(b=>`<div class="item"><span class="ball" style="background:${b.color};color:${b.color}"></span><div><b>${b.name}</b><br><small>${b.rarity} · ${b.price} 🪙</small><br><span class="owned">${save.selected===b.id?'Équipée':save.owned.includes(b.id)?'Possédée':''}</span></div><button class="secondary" onclick="buy('${b.id}')">${save.selected===b.id?'✓':save.owned.includes(b.id)?'Équiper':b.price?'Acheter':'Équiper'}</button></div>`).join('')}
function buy(id){let b=balls.find(x=>x.id===id);if(save.owned.includes(id)){save.selected=id;persist();render();return}if(save.coins>=b.price){save.coins-=b.price;save.owned.push(id);save.selected=id;persist();render();beep(660,.1,'sine',.05)}}
function beep(f,d,type='sine',v=.06){if(!soundOn)return;try{audio=audio||new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
function music(){if(!soundOn||musicTimer)return;let notes=[196,247,294,247,220,294,330,294],i=0;musicTimer=setInterval(()=>{if(running)beep(notes[i++%notes.length],.16,'triangle',.018)},520)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function spawn(){if(!running)return;if(target)target.remove();let el=document.createElement('div');el.className='target';let b=balls.find(x=>x.id===save.selected);let size=Math.max(40,68-(level-1)*3);el.style.width=el.style.height=size+'px';el.style.background=b.color;el.style.color=b.color;let maxX=$('arena').clientWidth-size,maxY=$('arena').clientHeight-size;el.style.left=Math.max(4,Math.random()*maxX)+'px';el.style.top=Math.max(4,Math.random()*maxY)+'px';el.onpointerdown=e=>{e.preventDefault();if(!running)return;hit(el)};$('arena').appendChild(el);target=el;
let life=Math.max(420,1500-(level-1)*80);setTimeout(()=>{if(running&&target===el){streak=0;combo=0;score=Math.max(0,score-3);beep(130,.08,'sawtooth',.04);spawn();update()}},life)}
function hit(el){if(!running)return;el.classList.add('hit');streak++;combo++;level=1+Math.floor(streak/10);let mult=1+Math.floor(streak/10);score+=10*mult+Math.min(combo,20);save.coins+=Math.max(1,Math.floor(mult/2));if(score>save.best)save.best=score;beep(420+Math.min(level,10)*35,.07,'square',.05);if(streak%10===0){beep(880,.16,'triangle',.08);$('msg').textContent='🔥 Niveau '+level+' ! Les cibles deviennent plus rapides et plus petites.'}else $('msg').textContent='Combo x'+combo+' · multiplicateur x'+mult;persist();update();setTimeout(spawn,80)}
function update(){$('score').textContent=score;$('time').textContent=time;$('level').textContent=level;$('coins').textContent=save.coins}
function end(){running=false;clearInterval(timer);stopMusic();if(target)target.remove();target=null;beep(180,.3,'sawtooth',.07);$('start').textContent='Rejouer';$('msg').textContent=`⏱️ Terminé ! Score : ${score} · Meilleur : ${save.best}`;persist()}
function start(){if(running)return;score=0;time=60;level=1;streak=0;combo=0;running=true;$('start').textContent='En cours…';$('msg').textContent='GO !';beep(520,.1,'square',.05);music();spawn();update();timer=setInterval(()=>{time--;if(time<=0){time=0;update();end()}else update()},1000)}
$('start').onclick=start;
$('sound').onclick=()=>{soundOn=!soundOn;$('sound').textContent=soundOn?'🔊 Son ON':'🔇 Son OFF';if(soundOn){beep(600,.08);music()}else stopMusic()};
$('reset').onclick=()=>{if(confirm('Effacer la progression, les pièces et les achats ?')){save={coins:0,owned:['red'],selected:'red',best:0};persist();render();update();$('msg').textContent='Progression réinitialisée.'}};
render();update();
</script>
</body></html>
