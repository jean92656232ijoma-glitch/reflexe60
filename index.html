<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10131a">
<meta name="mobile-web-app-capable" content="yes">
<title>Réflexe 60</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#10131a;
  color:white;
  overflow:hidden;
  user-select:none;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:700px;
  min-height:100vh;
  padding:18px 16px 14px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* SCORE */
.top{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.box{
  background:#292e3a;
  border:1px solid #414754;
  border-radius:18px;
  padding:12px 5px;
  text-align:center;
  box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.label{
  color:#b8bdc8;
  font-size:13px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.value{
  margin-top:4px;
  font-size:30px;
  font-weight:800;
}

#time{
  color:#58e39c;
}

/* GAME */
.game{
  position:relative;
  flex:1;
  min-height:430px;
  border:2px solid #292e39;
  border-radius:32px;
  background:
    radial-gradient(circle at 50% 45%,#171c27 0%,#10131a 65%);
  overflow:hidden;
  box-shadow:
    inset 0 0 40px rgba(0,0,0,.4),
    0 8px 30px rgba(0,0,0,.25);
}

.message{
  position:absolute;
  left:20px;
  right:20px;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  pointer-events:none;
}

.message h1{
  margin:0 0 12px;
  font-size:40px;
  font-weight:900;
}

.message p{
  margin:0;
  color:#b9bec9;
  font-size:17px;
  line-height:1.55;
}

.target{
  position:absolute;
  display:none;
  width:70px;
  height:70px;
  border-radius:50%;
  cursor:pointer;
  touch-action:manipulation;
  background:
    radial-gradient(circle,#fff 0 12%,#ffefef 13% 25%,#ff3d63 26% 55%,#c9143e 56% 100%);
  border:4px solid white;
  box-shadow:
    0 0 0 7px rgba(255,61,99,.18),
    0 0 30px rgba(255,61,99,.75);
  transform:translate(-50%,-50%);
  animation:pulse .7s infinite alternate;
}

.target.hit{
  animation:none;
  transform:translate(-50%,-50%) scale(1.35);
  opacity:0;
  transition:.12s;
}

@keyframes pulse{
  from{filter:brightness(.9); }
  to{filter:brightness(1.25); }
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
}

button{
  border:0;
  border-radius:18px;
  padding:16px 20px;
  font-size:17px;
  font-weight:800;
  color:white;
  cursor:pointer;
  touch-action:manipulation;
}

#start{
  flex:1;
  background:linear-gradient(135deg,#5968ff,#8b45ff);
  box-shadow:0 8px 25px rgba(91,82,255,.35);
}

#start:active{
  transform:scale(.97);
}

#reset{
  width:110px;
  background:#292e3a;
  border:1px solid #414754;
}

/* GAME OVER */
.result{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(10,12,18,.88);
  backdrop-filter:blur(8px);
  text-align:center;
  padding:30px;
}

.result-card{
  width:100%;
  max-width:400px;
  background:#202530;
  border:1px solid #3c4350;
  border-radius:26px;
  padding:30px 20px;
  box-shadow:0 15px 50px rgba(0,0,0,.5);
}

.result h2{
  margin:0 0 10px;
  font-size:32px;
}

.final-score{
  font-size:55px;
  font-weight:900;
  margin:10px 0;
}

.best{
  color:#58e39c;
  font-size:17px;
}

@media(max-width:420px){
  .app{
    padding:12px 12px 10px;
  }

  .message h1{
    font-size:32px;
  }

  .message p{
    font-size:15px;
  }

  .game{
    min-height:400px;
    border-radius:26px;
  }

  .value{
    font-size:27px;
  }

  .target{
    width:62px;
    height:62px;
  }

  #reset{
    width:95px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="box">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>

      <div class="label">Temps</div>
      <div class="value" id="time">60</div>

        Tu as <b>60 secondes !</b>
      </p>
    </div>

    <div class="target" id="target"></div>

    <div class="result" id="result">
      <div class="result-card">

        <div class="final-score" id="finalScore">0</div>
        <div class="best" id="bestText"></div>
      </div>
    </div>

  </div>

  <div class="controls">
    <button id="start">▶️ JOUER</button>
    <button id="reset">↻ RESET</button>
  </div>

</div>

const bestText = document.getElementById("bestText");
